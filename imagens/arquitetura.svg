  <polygon points="810,243 798,238 798,248" fill="#1565c0"/>
  <text x="762" y="233" text-anchor="middle" class="label" fill="#1565c0">Wazuh Agent → eve.json → Manager</text>

  <!-- 4. Telemetria Endpoints -> SIEM -->
  <path d="M 532 628 Q 660 628 810 370" fill="none" stroke="#42a5f5" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="810,370 802,380 812,377" fill="#42a5f5"/>
  <path d="M 762 628 Q 860 628 980 370" fill="none" stroke="#42a5f5" stroke-width="1.8" stroke-dasharray="6,4"/>
  <polygon points="980,370 970,375 973,365" fill="#42a5f5"/>
  <text x="920" y="560" text-anchor="middle" class="label" fill="#1565c0">Wazuh Agent → Manager (TCP/1514)</text>

  <!-- ============================================================ -->
  <!-- PAINEL LATERAL DE ESPECIFICAÇÕES                              -->
  <!-- ============================================================ -->
  <rect x="1135" y="300" width="175" height="455" rx="8" ry="8" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="1222" y="325" text-anchor="middle" class="spec-title">ESPECIFICAÇÕES</text>
  <text x="1222" y="340" text-anchor="middle" class="spec-title">DO LABORATÓRIO</text>
  <line x1="1150" y1="353" x2="1295" y2="353" stroke="#bdbdbd" stroke-width="1"/>
  <text x="1150" y="380" class="spec-body">• Host: AMD Ryzen 7</text>
  <text x="1150" y="397" class="spec-body">  5700X</text>
  <text x="1150" y="420" class="spec-body">• Memória: 32 GB DDR4</text>
  <text x="1150" y="443" class="spec-body">• Armazenamento:</text>
  <text x="1150" y="460" class="spec-body">  NVMe 1 TB</text>
  <text x="1150" y="483" class="spec-body">• Hipervisor: VMware</text>
  <text x="1150" y="500" class="spec-body">  Workstation Pro</text>
  <text x="1150" y="530" class="spec-body">• Sensor: Suricata 7.x</text>
  <text x="1150" y="553" class="spec-body">• SIEM: Wazuh 4.9.x</text>
  <text x="1150" y="576" class="spec-body">• Regras Suricata: 8</text>
  <text x="1150" y="599" class="spec-body">• Regras Wazuh:</text>
  <text x="1150" y="616" class="spec-body">  conforme arquivo</text>
  <text x="1150" y="633" class="spec-body">  local real</text>
  <text x="1150" y="663" class="spec-body">• Estado: ambiente de</text>
  <text x="1150" y="680" class="spec-body">  estudo e validação</text>
  <text x="1150" y="710" class="spec-body">• Notificação: Telegram</text>
  <text x="1150" y="727" class="spec-body">  (alertas ≥ nivel 12)</text>

  <!-- ============================================================ -->
  <!-- CICLO DE DETECÇÃO                                             -->
  <!-- ============================================================ -->
  <rect x="60" y="820" width="290" height="130" rx="8" ry="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="205" y="855" text-anchor="middle" class="card-title" fill="#c62828">1. SIMULAÇÃO</text>
  <text x="205" y="885" text-anchor="middle" class="card-body">Kali Linux</text>
  <text x="205" y="908" text-anchor="middle" class="card-body">Atividade controlada</text>

  <rect x="380" y="820" width="290" height="130" rx="8" ry="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="525" y="855" text-anchor="middle" class="card-title" fill="#ef6c00">2. COLETA</text>
  <text x="525" y="885" text-anchor="middle" class="card-body">Suricata: eve.json</text>
  <text x="525" y="908" text-anchor="middle" class="card-body">Agents: auth.log e eventos Windows</text>

  <rect x="700" y="820" width="290" height="130" rx="8" ry="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="845" y="855" text-anchor="middle" class="card-title" fill="#1565c0">3. CORRELAÇÃO</text>
  <text x="845" y="882" text-anchor="middle" class="card-body">Wazuh Manager</text>
  <text x="845" y="902" text-anchor="middle" class="card-body">Regras, severidade e</text>
  <text x="845" y="922" text-anchor="middle" class="card-body">MITRE ATT&amp;CK quando aplicável</text>

  <rect x="1020" y="820" width="290" height="130" rx="8" ry="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1165" y="855" text-anchor="middle" class="card-title" fill="#2e7d32">4. ANÁLISE</text>
  <text x="1165" y="885" text-anchor="middle" class="card-body">Wazuh Dashboard</text>
  <text x="1165" y="908" text-anchor="middle" class="card-body">Triagem e evidências</text>

  <!-- Setas entre cards -->
  <line x1="350" y1="885" x2="380" y2="885" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="380,885 370,880 370,890" fill="#9e9e9e"/>
  <line x1="670" y1="885" x2="700" y2="885" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="700,885 690,880 690,890" fill="#9e9e9e"/>
  <line x1="990" y1="885" x2="1020" y2="885" stroke="#9e9e9e" stroke-width="2"/>
  <polygon points="1020,885 1010,880 1010,890" fill="#9e9e9e"/>

  <!-- ============================================================ -->
  <!-- LEGENDA                                                       -->
  <!-- ============================================================ -->
  <rect x="60" y="970" width="1250" height="58" rx="6" ry="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="85" y1="990" x2="130" y2="990" stroke="#c62828" stroke-width="2.5"/>
  <text x="137" y="994" class="legend-text">Atividade controlada</text>
  <line x1="340" y1="990" x2="385" y2="990" stroke="#ef6c00" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="392" y="994" class="legend-text">Tráfego observado pelo Suricata</text>
  <line x1="660" y1="990" x2="705" y2="990" stroke="#1565c0" stroke-width="2.5"/>
  <text x="712" y="994" class="legend-text">Eventos Sensor → Manager</text>
  <line x1="85" y1="1014" x2="130" y2="1014" stroke="#42a5f5" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="137" y="1018" class="legend-text">Telemetria Agents → Manager</text>
  <line x1="420" y1="1014" x2="465" y2="1014" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="472" y="1018" class="legend-text">Dados indexados para análise</text>
  <line x1="700" y1="1014" x2="745" y2="1014" stroke="#0277bd" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="752" y="1018" class="legend-text">Alertas de alta severidade → Telegram</text>

  <!-- Nota VMnet8 -->
  <text x="30" y="1045" class="note">VMnet8/NAT: interface secundária utilizada somente para atualizações e instalação de dependncias</text>

  <!-- Rodapé -->
  <text x="1570" y="1045" text-anchor="end" class="footer-text">Leonardo Ramos · LeoSec1 · github.com/LeoSec1/soc-homelab</text>

